components:
  schemas:
    CampaignResource:
      title: 'Campaign Resource'
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Campagne de test'
        user_id:
          type: integer
          example: 10
        type_campaign_id:
          type: integer
          example: 3
        status:
          properties:
            value:
              type: string
              example: active
            label:
              type: string
              example: Active
          type: object
        is_published:
          type: boolean
          example: true
        description:
          type: string
          example: 'Description de la campagne'
        user:
          properties:
            id:
              type: integer
              example: 10
            name:
              type: string
              example: 'Jean Dupont'
          type: object
          nullable: true
        user_has_liked:
          type: boolean
          example: true
        user_has_shared:
          type: boolean
          example: false
        type:
          properties:
            id:
              type: integer
              example: 2
            name:
              type: string
              example: 'Campagne Marketing'
          type: object
          nullable: true
        dates:
          properties:
            created_at:
              type: string
              example: '2025-09-21 12:00'
            updated_at:
              type: string
              example: '2025-09-21 12:30'
            time_ago:
              type: string
              example: 'il y a 2 heures'
          type: object
        images_count:
          type: integer
          example: 3
        landing_pages_count:
          type: integer
          example: 1
        social_posts_count:
          type: integer
          example: 5
        total_views:
          type: integer
          example: 1000
        total_likes:
          type: integer
          example: 50
        total_shares:
          type: integer
          example: 20
        images:
          type: array
          items:
            properties:
              id:
                type: integer
                example: 1
              url:
                type: string
                example: 'https://cdn.site.com/image1.jpg'
              alt:
                type: string
                example: 'Image de la campagne'
              is_published:
                type: boolean
                example: true
              created_at:
                type: string
                example: '2025-09-21 12:15'
            type: object
      type: object
    PopularCampaignResourceSchema:
      title: 'Popular Campaign Resource'
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Campagne populaire'
        description:
          type: string
          example: 'Description de la campagne'
        type_campaign_id:
          type: integer
          example: 2
        image_path:
          type: string
          example: 'https://cdn.site.com/image1.jpg'
        total_views:
          type: integer
          example: 1200
        total_likes:
          type: integer
          example: 150
      type: object
    CampaignFeaturesResource:
      title: 'Campaign Features Resource'
      properties:
        id:
          type: integer
          example: 1
        campaign_id:
          type: integer
          example: 10
        feature_id:
          type: integer
          example: 3
      type: object
    CampaignInteractionResource:
      title: 'Campaign Interaction'
      description: "Représentation d'une interaction utilisateur avec une campagne"
      properties:
        id:
          type: integer
          example: 101
        campaign_id:
          description: 'Identifiant de la campagne'
          type: integer
          example: 12
        user_id:
          description: 'Identifiant de l’utilisateur ayant interagi'
          type: integer
          example: 45
        type:
          description: 'Type d’interaction (view, like, share…)'
          type: string
          example: like
        views:
          description: 'Nombre de vues associées'
          type: integer
          example: 5
        likes:
          description: 'Nombre de likes associés'
          type: integer
          example: 1
        shares:
          description: 'Nombre de partages associés'
          type: integer
          example: 0
        created_at:
          type: string
          format: date-time
          example: '2025-09-25T12:34:56Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-09-25T14:12:00Z'
      type: object
    CampaignInteractionMeta:
      title: 'Campaign Interaction Meta'
      description: "Métadonnées globales sur les interactions d'une campagne"
      properties:
        total_interactions:
          description: 'Nombre total d’interactions'
          type: integer
          example: 50
        total_views:
          description: 'Nombre total de vues'
          type: integer
          example: 120
        total_likes:
          description: 'Nombre total de likes'
          type: integer
          example: 30
        total_shares:
          description: 'Nombre total de partages'
          type: integer
          example: 10
      type: object
    CampaignTemplateResource:
      title: 'Campaign Template'
      description: "Représentation d'un modèle de campagne avec ses stats et informations détaillées"
      properties:
        id:
          description: 'Identifiant du template'
          type: integer
          example: 7
        name:
          description: 'Nom du template'
          type: string
          example: 'Template Marketing Automatique'
        description:
          description: 'Description du template'
          type: string
          example: 'Template pour campagne marketing automatisée'
        category:
          properties:
            id:
              type: integer
              example: 2
            name:
              type: string
              example: Marketing
            icon:
              type: string
              example: marketing-icon
          type: object
          nullable: true
        type:
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Email Campaign'
          type: object
          nullable: true
        author:
          description: 'Auteur du template'
          type: string
          example: 'John Doe'
        thumbnail:
          description: 'URL de la miniature du template'
          type: string
          example: 'https://example.com/thumbnails/template7.png'
        preview:
          description: "URL de l'aperçu du template"
          type: string
          example: 'https://example.com/previews/template7.png'
        isPremium:
          description: 'Indique si le template est premium'
          type: boolean
          example: true
        rating:
          description: 'Note moyenne du template'
          type: number
          format: float
          example: 4.5
        uses:
          description: 'Nombre de fois que le template a été utilisé'
          type: integer
          example: 120
        tags:
          description: 'Tags associés au template'
          type: array
          items:
            type: string
          example:
            - marketing
            - automation
            - email
        socialPosts:
          type: array
          items:
            properties:
              id:
                type: integer
                example: 101
              content:
                type: string
                example: 'Découvrez notre nouveau produit !'
              created_at:
                type: string
                format: date-time
                example: '2025-09-25 12:34'
              social:
                properties:
                  id:
                    type: integer
                    example: 3
                  name:
                    type: string
                    example: LinkedIn
                type: object
                nullable: true
            type: object
        createdAt:
          description: 'Date de création du template'
          type: string
          format: date
          example: '2025-09-01'
      type: object
    Error400:
      title: 'Requête incorrecte'
      description: 'Les paramètres de la requête sont invalides'
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Paramètres de requête invalides'
      type: object
    Error401:
      title: 'Non authentifié'
      description: 'Authentification requise ou token invalide'
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Authentification requise'
      type: object
    Error403:
      title: 'Accès refusé'
      description: 'Permissions insuffisantes'
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Accès non autorisé'
      type: object
    Error422:
      title: 'Erreur de validation'
      description: 'Données de validation invalides'
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Les données fournies sont invalides'
        errors:
          type: object
          example:
            email:
              - 'Le champ email est obligatoire.'
            password:
              - 'Le mot de passe doit contenir au moins 8 caractères.'
      type: object
    Error500:
      title: 'Erreur serveur'
      description: 'Erreur interne du serveur'
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Erreur interne du serveur'
      type: object

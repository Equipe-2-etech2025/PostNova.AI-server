          type: integer
          example: 1
        content:
          type: string
          example: 'Créer un prompt pour campagne X'
        campaign_id:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
          example: '2025-09-25 15:30:00'
        updated_at:
          type: string
          format: date-time
          example: '2025-09-25 15:30:00'
      type: object
    SocialResource:
      title: 'Social Resource'
      description: 'Représente un post social'
      properties:
        name:
          type: string
          example: 'Nom du post social'
      type: object

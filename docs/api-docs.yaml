  /api/password/reset:
    post:
      tags:
        - PasswordReset
      summary: 'Réinitialiser le mot de passe'
      description: 'Réinitialise le mot de passe utilisateur avec un token de réinitialisation valide'
      operationId: resetPassword
      requestBody:
        description: 'Données pour réinitialiser le mot de passe'
        required: true
        content:
          application/json:
            schema:
              required:
                - token
                - email
                - password
                - password_confirmation
              properties:
                token:
                  type: string
                  example: token123
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: NewPassword123!
                password_confirmation:
                  type: string
                  format: password
                  example: NewPassword123!
              type: object
      responses:
        200:
          description: 'Mot de passe réinitialisé avec succès'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Mot de passe réinitialisé avec succès.'
                type: object
        422:
          description: 'Données de validation invalides'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Les données fournies sont invalides.'
                  errors:
                    type: object
                    example:
                      email:
                        - "L'adresse email est invalide."
                      password:
                        - 'Le mot de passe doit contenir au moins 8 caractères.'
                        - 'Le mot de passe doit contenir au moins une lettre majuscule.'
                        - 'Le mot de passe doit contenir au moins un chiffre.'
                      password_confirmation:
                        - 'La confirmation du mot de passe ne correspond pas.'
                type: object
        500:
          description: 'Erreur serveur interne'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Une erreur interne est survenue. Veuillez réessayer plus tard.'
                  errors:
                    type: object
                    example:
                      server:
                        - 'Erreur lors de la mise à jour du mot de passe.'
                  debug:
                    description: 'Informations de débogage (uniquement en environnement de développement)'
                    type: object
                    example: []
                type: object
